[project]
name = "connect-more"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mirza-ahsan", email = "ahsan.17april@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.3",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "psutil==7.0.0",
    "py-cpuinfo==9.0.0",
    "pyzmq==26.4.0",
    "scipy==1.15.3",
]

[project.scripts]
connect-more = "connect_more:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.uv]
package = false
required-version = "==0.12.8"


