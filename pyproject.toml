[project]
name = "connect-more"
version = "0.1.0"
description = "Distributed Connect Four solver for heterogeneous consumer machines"
authors = [
    { name = "mirza-ahsan", email = "ahsan.17april@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.3",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "psutil==7.0.0",
    "py-cpuinfo==9.0.0",
    "pyzmq==26.4.0",
    "scipy==1.15.3",
]

[dependency-groups]
dev = [
    "pyrefly==1.2.0",
    "pytest==8.3.5",
    "ruff==0.16.5",
]

[tool.uv]
package = false
required-version = "==0.13.4"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["deliverables"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes (unused names, undefined variables)
    "I",       # import sorting
    "B",       # bugbear (likely bugs)
    "UP",      # modern Python 3.12 syntax
    "SIM",     # simplifications
    "PTH",     # use pathlib (CLAUDE.md)
    "ANN",     # type hints on all functions (CLAUDE.md)
    "RUF",     # ruff-specific checks
]

[tool.pyrefly]
python-version = "3.12"
project-excludes = ["deliverables/**", "build/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import common/, coordinator/ and worker/ from the repo root
